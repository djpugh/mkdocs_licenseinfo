[build-system]
requires = ["setuptools >= 40.9.0", 'setuptools_scm[toml]>=6.2']
build-backend = "setuptools.build_meta"


[project]
name = "mkdocs_licenseinfo"
authors = [{name = "David J Pugh", email="djpugh@gmail.com"}]
maintainers = [{ name = "David J Pugh", email="djpugh@gmail.com" }]
description = "mkdocs extension to visualise package dependencies license information"
readme = {file="README.md", content-type = "text/markdown"}
keywords = ["mkdocs", "mkdocs-plugin", "license", "licenseinfo", "documentation", "sbom"]
requires-python = '>=3.9'
classifiers = [
        "Environment :: Console",
        "Topic :: Software Development :: Libraries :: Python Modules",
        "Programming Language :: Python :: 3",
        "Programming Language :: Python :: 3.9",
        "Programming Language :: Python :: 3.10",
        "Programming Language :: Python :: 3.11",
        "Programming Language :: Python :: 3.12",
        "Programming Language :: Python :: 3.13",
        "Intended Audience :: Developers",
    	"License :: OSI Approved :: MIT License",
        "Operating System :: Microsoft :: Windows",
        "Operating System :: POSIX :: Linux",
        "Operating System :: MacOS :: MacOS X",
        "Natural Language :: English"
        # "Development Status :: 6 - Mature"
]
dependencies = [
    'jinja2',
    'mkdocs>=1.4',
    'tomli>=2; python_version < "3.11"',
    'uv',
]

dynamic = ["version"]


[dependency-groups]
dev = [
    "setuptools_scm[toml]",
    "nox",
]
lint = [
    "ruff>=0.1.0",
    "pre-commit",
]
security = [
    "pip-audit",
    "bandit",
]
types = [
    "mypy",
    "types-setuptools",
]
test = [
    "pytest>=7.3.1",
    "pytest-cov>=4",
    "pytest-subtests",
    "nskit",
    "mkdocs-material",
]
docs = [
    "mkdocs",
    "mkdocstrings[python]",
    "mkdocs-git-revision-date-localized-plugin",
    "mkdocs-material",
    "mkdocs-git-authors-plugin",
    "mkdocs-coverage",
    "mkdocs-include-markdown-plugin",
    "mkdocs-github-changelog",
    "mike",
]
build = []

[tool.uv]
default-groups = ["dev", "lint", "security", "types", "test", "docs", "build"]

[project.urls]
homepage = "https://github.com/djpugh/mkdocs_licenseinfo"
repository = "https://github.com/djpugh/mkdocs_licenseinfo"
documentation = "https://djpugh.github.io/mkdocs_licenseinfo"

[project.scripts]

[project.entry-points."mkdocs.plugins"]
mkdocs_licenseinfo = "mkdocs_licenseinfo.plugin:MkdocsLicenseInfoPlugin"

[project.entry-points."mkdocs_licenseinfo.jinja_environment_factory"]
default = "mkdocs_licenseinfo.render_markdown:_EnvironmentFactory.default_environment"


# Tools
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = [
    "*.md",
    "*.ini",
    "*.toml",
    "*.whl",
    "*.bicep"
]

[tool.setuptools_scm]
write_to ="src/mkdocs_licenseinfo/_version.py"
write_to_template = '__version__ = "{version}"'
version_scheme = "no-guess-dev"

[tool.mypy]
python_version = "3.11"
show_error_codes = true
strict = true
overrides = [
  { module = [
    "mkdocs_licenseinfo._version"
  ], ignore_missing_imports = true },
]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports
"tests/**/*.py" = ["B", "F401", "F811"]  # test files

[tool.ruff.lint.isort]
known-first-party = ["mkdocs_licenseinfo"]